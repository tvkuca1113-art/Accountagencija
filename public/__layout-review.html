<!doctype html><html lang="bs"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>ACCOUNT — pregled rasporeda</title>
<style>body{font:14px system-ui;background:#dae2e8;margin:0;padding:20px}header{display:flex;align-items:center;gap:16px;margin-bottom:20px}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px}iframe{display:block;border:0;margin:0 auto;background:white;box-shadow:0 2px 12px #1232}p{margin:0}</style>
<header><strong>Pregled rasporeda</strong><label>Širina<select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Stranica<select id="page"><option value="/">Početna</option><option value="/kontakt">Kontakt</option><option value="/usluge">Usluge</option><option value="/o-nama">O nama</option><option value="/korisni-alati">Korisni alati</option><option value="/racunovodstvo">Računovodstvo</option><option value="/konzultantske-usluge">Savjetovanje</option><option value="/zastupanje-inostranih-poduzeca">Inostrana preduzeća</option><option value="/registracija-firmi-obrta-udruzenja">Registracija</option><option value="/poslovni-projekti">Projekti</option><option value="/savjeti">Savjeti</option><option value="/politika-privatnosti">Privatnost</option></select></label><p id="status" role="status"></p></header>
<iframe id="preview" title="Prikaz stranice" width="390" height="844"></iframe>
<script>
const width=document.getElementById('width'),page=document.getElementById('page'),frame=document.getElementById('preview'),status=document.getElementById('status');
width.addEventListener('change',()=>frame.width=width.value);
async function load(){status.textContent='Učitavanje…';const response=await fetch(page.value);const html=await response.text();frame.srcdoc=html.replace('<head>',`<head><base href="${location.origin}${page.value}" target="_top">`);}
frame.addEventListener('load',()=>status.textContent='Prikaz učitan');page.addEventListener('change',load);load();
</script></html>
